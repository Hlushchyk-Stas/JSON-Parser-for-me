<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Timestamps & Text Extractor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --border: #1f293d;
      --text: #f3f4f6;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #059669;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.2s, border-color 0.2s, color 0.2s;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px;
    }

    .container {
      width: 100%;
      max-width: 1180px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .title-group h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .title-group p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .theme-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }

    .theme-btn:hover {
      border-color: var(--primary);
    }

    .dropzone {
      border: 2px dashed var(--border);
      background: var(--card-bg);
      border-radius: 12px;
      padding: 22px;
      text-align: center;
      cursor: pointer;
      position: relative;
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.04);
    }

    .dropzone input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .dropzone-text {
      font-size: 14px;
      color: var(--text-muted);
    }

    .dropzone-text b {
      color: var(--primary);
    }

    .editor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 820px) {
      .editor-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-header {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 8px;
      background: rgba(0, 0, 0, 0.08);
    }

    .actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn-action {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-action:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-primary {
      background: var(--primary);
      border: 1px solid var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      color: #fff;
    }

    .status-badge {
      font-size: 11px;
      font-family: var(--font-mono);
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(59, 130, 246, 0.1);
      color: var(--primary);
    }

    textarea {
      width: 100%;
      height: 480px;
      border: none;
      background: transparent;
      padding: 16px;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      color: var(--text);
      resize: vertical;
      outline: none;
    }

    textarea::placeholder {
      color: var(--text-muted);
      opacity: 0.4;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--success);
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
      pointer-events: none;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title-group">
        <h1>Парсер JSON з таймкодами у чистий текст</h1>
        <p>Витягує лише <code>[Таймкод] Текст</code>, видаляючи масиви слів, оцінки та службовий синтаксис</p>
      </div>
      <button class="theme-btn" onclick="toggleTheme()">🌓 Змінити тему</button>
    </header>

    <div class="dropzone" id="dropArea">
      <input type="file" id="fileInput" accept=".json,.txt">
      <div class="dropzone-text">
        Перетягніть файл <b>timestamps.json</b> сюди або <b>клікніть для завантаження</b>
      </div>
    </div>

    <div class="editor-grid">
      <div class="card">
        <div class="card-header">
          <span>Вхідний сирий JSON</span>
          <div class="actions">
            <button class="btn-action" onclick="clearAll()">Очистити</button>
          </div>
        </div>
        <textarea id="inputText" placeholder="Вставте вміст файлу сюди... Працює навіть якщо скопійовано частину або пошкоджено синтаксис!"></textarea>
      </div>

      <div class="card">
        <div class="card-header">
          <div style="display:flex; align-items:center; gap:8px;">
            <span>Результат</span>
            <span id="counterBadge" class="status-badge" style="display:none;">0 рядків</span>
          </div>
          <div class="actions">
            <button class="btn-action btn-primary" onclick="copyResult()">Скопіювати</button>
            <button class="btn-action" onclick="downloadResult()">Зберегти у .txt</button>
          </div>
        </div>
        <textarea id="outputText" readonly placeholder="Тут з'явиться відформатований текст:
[00:10] Доброго дня.
[01:17] Старості доєдналися?
..."></textarea>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">Скопійовано!</div>

  <script>
    const inputEl = document.getElementById('inputText');
    const outputEl = document.getElementById('outputText');
    const counterBadge = document.getElementById('counterBadge');
    const toastEl = document.getElementById('toast');

    inputEl.addEventListener('input', parseAndExtract);

    // Конвертація секунд у [ГГ:ХХ:ХХ] або [ХХ:ХХ]
    function formatTime(seconds) {
      const s = Math.floor(Number(seconds) || 0);
      const hrs = Math.floor(s / 3600);
      const mins = Math.floor((s % 3600) / 60);
      const secs = s % 60;
      const pad = (n) => String(n).padStart(2, '0');

      if (hrs > 0) {
        return `[${pad(hrs)}:${pad(mins)}:${pad(secs)}]`;
      }
      return `[${pad(mins)}:${pad(secs)}]`;
    }

    // Декодування будь-яких \uXXXX послідовностей у кирилицю
    function unescapeUnicode(str) {
      return str.replace(/\\u([0-9a-fA-F]{4})/g, (_, hex) => 
        String.fromCharCode(parseInt(hex, 16))
      );
    }

    // Головна функція екстракції
    function parseAndExtract() {
      let raw = inputEl.value;
      if (!raw.trim()) {
        outputEl.value = '';
        counterBadge.style.display = 'none';
        return;
      }

      // Прибираємо префікси від інструментів на зразок або службові мітки
      raw = raw.replace(/^[\s\S]*?\{/, '{');

      // Попередньо декодуємо юнікод, щоб текст був одразу нормальним
      raw = unescapeUnicode(raw);

      let extractedLines = [];

      // Метод 1: Спроба класичного JSON.parse
      try {
        const parsed = JSON.parse(raw);
        const segments = parsed.segments || (Array.isArray(parsed) ? parsed : null);

        if (Array.isArray(segments)) {
          extractedLines = segments
            .filter(item => item && (item.text || item.start !== undefined))
            .map(item => {
              const time = formatTime(item.start !== undefined ? item.start : 0);
              const txt = (item.text || '').replace(/\s+/g, ' ').trim();
              return `${time} ${txt}`;
            });
        }
      } catch (err) {
        // Якщо JSON.parse не пройшов (обрізаний файл / помилка синтаксису) —
        // вмикається Метод 2: надійний видобуток фрагментів через Regex
      }

      // Метод 2 (резервний / fault-tolerant):
      if (extractedLines.length === 0) {
        // Шукаємо фрагменти, де є "start": число і "text": "рядок"
        // Ігноруємо блок words
        const segmentRegex = /"start":\s*([0-9.]+)[^}]*?"text":\s*"([^"\\]*(?:\\.[^"\\]*)*)"/g;
        let match;

        while ((match = segmentRegex.exec(raw)) !== null) {
          const time = formatTime(match[1]);
          let cleanText = match[2]
            .replace(/\\n/g, ' ')
            .replace(/\\"/g, '"')
            .replace(/\s+/g, ' ')
            .trim();
          extractedLines.push(`${time} ${cleanText}`);
        }

        // Якщо в файлі спершу йде text, а потім start
        if (extractedLines.length === 0) {
          const altRegex = /"text":\s*"([^"\\]*(?:\\.[^"\\]*)*)"[^}]*?"start":\s*([0-9.]+)/g;
          while ((match = altRegex.exec(raw)) !== null) {
            const time = formatTime(match[2]);
            let cleanText = match[1]
              .replace(/\\n/g, ' ')
              .replace(/\\"/g, '"')
              .replace(/\s+/g, ' ')
              .trim();
            extractedLines.push(`${time} ${cleanText}`);
          }
        }
      }

      if (extractedLines.length > 0) {
        outputEl.value = extractedLines.join('\n');
        counterBadge.textContent = `${extractedLines.length} сегментів`;
        counterBadge.style.display = 'inline-block';
      } else {
        // Якщо жодного таймкоду взагалі не виявлено
        outputEl.value = raw;
        counterBadge.style.display = 'none';
      }
    }

    // Drag and Drop & Завантаження файлу
    const fileInput = document.getElementById('fileInput');
    const dropArea = document.getElementById('dropArea');

    fileInput.addEventListener('change', (e) => loadFile(e.target.files[0]));

    ['dragenter', 'dragover'].forEach(name => {
      dropArea.addEventListener(name, (e) => {
        e.preventDefault();
        dropArea.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach(name => {
      dropArea.addEventListener(name, (e) => {
        e.preventDefault();
        dropArea.classList.remove('dragover');
      });
    });

    dropArea.addEventListener('drop', (e) => {
      const file = e.dataTransfer.files[0];
      if (file) loadFile(file);
    });

    function loadFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        inputEl.value = e.target.result;
        parseAndExtract();
      };
      reader.readAsText(file);
    }

    function clearAll() {
      inputEl.value = '';
      outputEl.value = '';
      counterBadge.style.display = 'none';
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 2000);
    }

    function copyResult() {
      if (!outputEl.value) return;
      navigator.clipboard.writeText(outputEl.value);
      showToast('Текст скопійовано!');
    }

    function downloadResult() {
      if (!outputEl.value) return;
      const blob = new Blob([outputEl.value], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'clean_transcript.txt';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      document.documentElement.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
    }
  </script>
</body>
</html>
